name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check repository baseline
        run: npm run verify:repo
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm run test:ci
      - name: 数据底座契约与 Mock 校验
        run: npm run validate:foundation
      - name: IaC Ruleset offline tests
        run: npm run test:infra
      - name: Production build
        run: npm run build

  e2e:
    name: Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: 安装中文截图字体
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Browser smoke tests (both desktop viewports)
        run: npm run test:e2e
      - name: Core 原型合成契约测试（两个桌面视口）
        run: npm run test:e2e:core
      - name: Upload browser report and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
            playwright-report-core-prototype/
            test-results-core-prototype/
          retention-days: 14
